<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 최저가 트래커</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b1120; font-family: -apple-system, sans-serif; }
    #loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #94a3b8; }
    .spinner { width: 40px; height: 40px; border: 3px solid rgba(99,102,241,0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-weight: 600; color: #f8fafc; font-size: 15px;">최신 가격 트래킹 보드 동기화 중...</div>
    <div style="font-size: 12px; margin-top: 6px; color: #64748b;">구글 드라이브 최신 버전을 실시간으로 불러옵니다.</div>
  </div>
  <script>
    const DRIVE_FILE_ID = '191FWXJvOqxs715jx9ndL5ir7E_9nc3qX';
    const RAW_URL = 'https://lh3.googleusercontent.com/d/' + DRIVE_FILE_ID + '?t=' + Date.now();

    async function load() {
      try {
        const res = await fetch(RAW_URL);
        if (!res.ok) throw new Error('status: ' + res.status);
        const html = await res.text();
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        document.body.innerHTML = '<iframe src="https://drive.google.com/uc?id=' + DRIVE_FILE_ID + '&export=download" style="width:100%;height:100%;border:none;position:absolute;top:0;left:0;"></iframe>';
      }
    }
    load();
  </script>
</body>
</html>
